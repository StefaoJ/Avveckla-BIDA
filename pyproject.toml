[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-app-diagnostics"
version = "0.1.0"
description = "Python-based diagnostic tool for inspecting legacy Windows applications"
readme = "README.md"
license = {text = "MIT"}
requirements-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["windows", "automation", "diagnostics", "pywinauto", "legacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pywinauto>=0.6.8",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
uia = ["pywinauto[uiacom]>=0.6.8"]
win32 = ["pywin32>=300"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
inspect_windows_app = "scripts.inspect_windows_app:main"

[tool.setuptools]
packages = ["src", "src.windows"]
package-dir = {"" = "."}

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.flake8]
max-line-length = 100
extend-exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable name should be lowercase
]
